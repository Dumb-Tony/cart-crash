{id:'market',name:'Market Mile',length:2400,grade:.215,cap:70,target:46,description:'Busy streets, alternating barricades, and a fast market straight.',bends:[[200,340,20],[1100,380,-24],[1720,420,26]],hazards:[{s:370,x:-4,w:2.6,type:'cones'},{s:1230,x:-4,w:5,type:'barrier'},{s:1430,x:3,w:3,type:'oil'},{s:1620,x:3.5,w:5,type:'barrier'},{s:1840,x:-3,w:3,type:'boost'},{s:2050,x:-3.5,w:5,type:'barrier'}]},
{id:'quarry',name:'Quarry Drop',length:3000,grade:.245,cap:76,target:49,description:'Steeper, longer, faster. Commit to your line between work zones.',bends:[[200,350,-22],[1120,380,28],[1800,420,-30],[2460,400,24]],hazards:[{s:400,x:4,w:3,type:'oil'},{s:1190,x:3.5,w:5,type:'barrier'},{s:1400,x:-3,w:3,type:'boost'},{s:1590,x:-3.5,w:5,type:'barrier'},{s:1810,x:3,w:3,type:'cones'},{s:2030,x:3.5,w:5,type:'barrier'},{s:2240,x:-3,w:3,type:'oil'},{s:2440,x:-3,w:3,type:'boost'},{s:2660,x:-3.5,w:5,type:'barrier'}]}
];
const UPGRADES=[{id:'bearings',name:'Race bearings',cost:180,description:'+36 km/h top speed and stronger downhill acceleration.'},{id:'steering',name:'Caster stabilizers',cost:220,description:'25% stronger steering and quicker response.'},{id:'suspension',name:'Spring chassis',cost:160,description:'More forgiving landing angles and heavy touchdowns.'}];
let course=COURSES[0],career={bolts:Number.isFinite(stored.career?.bolts)?Math.max(0,Math.floor(stored.career.bolts)):0,completed:COURSES.filter(c=>Array.isArray(stored.career?.completed)&&stored.career.completed.includes(c.id)).map(c=>c.id),upgrades:UPGRADES.filter(u=>Array.isArray(stored.career?.upgrades)&&stored.career.upgrades.includes(u.id)).map(u=>u.id)};
function hasUpgrade(id){return career.upgrades.includes(id)}
function courseUnlocked(id){const n=COURSES.findIndex(c=>c.id===id);return n===0||(n>0&&career.completed.includes(COURSES[n-1].id))}
function recordKey(){return course.id==='sunset'?chosen:course.id+'/'+chosen}
function medalKey(){return recordKey()}
function configure(){LENGTH=course.length;P.maxSpeed=course.cap+(hasUpgrade('bearings')?10:0);P.downhillGravity=42+(hasUpgrade('bearings')?3:0);P.response=hasUpgrade('steering')?8:6;P.align=(hasUpgrade('suspension')?28:20)*Math.PI/180;GATES=[{s:180,x:-3},{s:330,x:2},{s:520,x:-3},{s:720,x:3},{s:course.length-650,x:-3},{s:course.length-360,x:3}];best=records[recordKey()]??={time:null,score:0}}

function buyUpgrade(id){const u=UPGRADES.find(u=>u.id===id);if(!u||hasUpgrade(id)||career.bolts<u.cost)return false;career.bolts-=u.cost;career.upgrades.push(id);configure();save();return true}
function courseInput(s){const hazard=course.hazards.find(o=>o.s+14>s.s&&o.s-s.s<170);let x=s.s>730&&s.s<1080?4:0;if(hazard)x=hazard.type==='boost'?hazard.x:hazard.x>0?-3.5:3.5;return {steer:Math.abs(x-s.x)>.5?Math.sign(x-s.x):0,lean:0,crouch:false,brake:false}}

const CONTRACTS=[{id:'dash',name:'Downhill dash',goal:'Beat this hill’s target time.'},{id:'slalom',name:'Sidewalk slalom',goal:'Collect all six road gates in one run.'},{id:'air',name:'Air mail',goal:'Clear the dumpsters and land cleanly, without a recovery.'}];

let chosen='dash',badges=Array.isArray(stored.badges)?stored.badges.filter(x=>typeof x==='string'&&COURSES.some(l=>CONTRACTS.some(c=>x===(l.id==='sunset'?c.id:l.id+'/'+c.id)))):[];

let settings={mute:stored.mute!==false,reduced:stored.reduced!==false},best={time:Number.isFinite(stored.time)&&stored.time>=0?stored.time:null,score:Number.isFinite(stored.score)&&stored.score>=0?stored.score:0};

let keys=new Set(),state,mode='start',acc=0,last=0,debug=false,frameCost=0,simCost=0,audio;
let replay='',soakStart=0,soakRuns=0,perfFrames=0,perfSeconds=0,perfMax=0;
function fresh(){return {course:course.id,earned:0,invulnerable:0,hazardHits:new Set(),contract:chosen,gateHits:0,gateSeen:new Set(),landImpact:0,s:0,x:0,v:18,vx:0,h:0,vy:0,pitch:0,roll:0,time:0,charge:0,rampCharge:0,held:false,bank:0,pending:0,flow:1,peak:1,settle:0,crashes:0,safeS:0,safeX:0,camX:0,camYaw:0,camPitch:.075,camRoll:0,events:new Set(),gapEntry:false,clean:0,gaps:0,pumps:0,notice:'Point it downhill. Brake before the bend.',noticeUntil:5,flight:false};}
configure();state=fresh();
function segment(s){return TRACK.find(t=>s<t.end)||TRACK[TRACK.length-1]}
function center(s){return course.bends.reduce((x,b)=>x+b[2]*Math.sin(Math.max(0,Math.min(1,(s-b[0])/b[1]))*Math.PI)**2,0)}
// World-space course, with long rolls plus the authored compression dip.
function elevation(s){return -course.grade*s+8*Math.sin(s/160)-3*Math.exp(-(((s-625)/34)**2))}
function grade(s){return -(elevation(s+.5)-elevation(s-.5))}
function tangent(s){return (center(s+.5)-center(s-.5))}
function updateCamera(s,dt){const turn=Math.atan2(s.vx/Math.max(8,s.v),1);const pitch=Math.max(.035,Math.min(.16,grade(s.s)-.065));s.camX+=(center(s.s)+s.x-s.camX)*Math.min(1,dt*4);s.camYaw+=(turn-s.camYaw)*Math.min(1,dt*3);s.camPitch+=(pitch-s.camPitch)*Math.min(1,dt*2);s.camRoll+=((settings.reduced?0:-s.roll*.12)-s.camRoll)*Math.min(1,dt*4)}
function input(){if(replay==='course')return courseInput(state);if(replay==='slalom'){const target=GATES.find(g=>g.s>state.s)||{x:0},error=target.x-state.x;return {steer:Math.abs(error)>.5?Math.sign(error):0,lean:0,crouch:false,brake:false}} if(replay.startsWith('coast'))return {steer:0,lean:0,crouch:false,brake:false};if(replay)return {steer:state.s>200&&state.s<700?(state.x< -1.5?1:state.x>1.5?-1:0):(replay!=='safe'&&state.s>700&&state.x<3.5?1:0),lean:0,crouch:(state.s>590&&state.s<650)||(replay==='early'&&state.s>835&&state.s<865),brake:false};return {steer:(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),lean:(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0),crouch:keys.has('Space'),brake:keys.has('ShiftLeft')||keys.has('ShiftRight')}}
function notice(s,text){s.notice=text;s.noticeUntil=s.time+3}
function tone(freq,duration=.1){if(settings.mute||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function award(s,id,points){if(s.events.has(id))return;s.events.add(id);s.pending+=Math.round(points*s.flow);s.flow=Math.min(5,s.flow+.25);s.peak=Math.max(s.peak,s.flow);s.settle=0;tone(500+s.flow*100)}
function crash(s,why){s.invulnerable=1.2;s.crashes++;s.time+=2;s.s=s.safeS;s.x=s.safeX;s.v=9;s.vx=s.h=s.vy=s.pitch=s.roll=s.charge=s.rampCharge=0;s.pending=0;s.flow=1;s.flight=false;s.gapEntry=false;s.settle=0;notice(s,why+' · recovered, +2s · pending FLOW lost');tone(80,.3)}
function step(s,i,dt=DT){
 s.time+=dt;s.invulnerable=Math.max(0,s.invulnerable-dt);s.landImpact=Math.max(0,s.landImpact-dt*4);const t=segment(s.s),ground=s.h<=0;const old=s.s;
 if(ground&&i.crouch)s.charge=Math.min(1,s.charge+dt*4);
 if(s.held&&!i.crouch){if(ground&&s.s>=870&&s.s<900&&s.x>1.4){s.rampCharge=Math.max(s.rampCharge,s.charge);notice(s,'RAMP READY · takeoff at the lip')}else if(ground){const power=s.charge;s.h=.02;s.vy=5.5+3*power;s.flight=true;notice(s,'HOP! · release lean to land level');tone(390);if(s.s>=635&&s.s<=690&&power>.15){s.v=Math.min(P.maxSpeed,s.v+4*power);s.pumps++;notice(s,'PUMP + HOP! · speed carried out of the dip');tone(420)}}s.charge=0}if(!ground)s.charge=0;s.held=i.crouch;
 let rough=Math.abs(s.x)>t.width-1.4?2.8:1;
 if(s.s>770&&s.s<1090&&s.x<1.4)rough=2.3; // readable rough safe lane versus ramp line
 s.v=Math.max(3,Math.min(P.maxSpeed,s.v+(P.downhillGravity*grade(s.s)-t.friction*rough-.002*s.v*s.v-(i.brake&&ground?12:0)-Math.abs(i.steer)*s.v*.035+(ground?i.lean*.12:0))*dt));
 const target=(ground?tangent(s.s)*s.v*(1-(1-P.casterFollow)*Math.min(1,s.v/45)):s.vx)+i.steer*(hasUpgrade('steering')?1.25:1)*(ground?7.5:7.5*P.air)*(1-.35*s.v/P.maxSpeed);
 s.vx+=(target-s.vx)*Math.min(1,P.response*(ground?1:P.air)*dt);s.x+=(s.vx-tangent(s.s)*s.v)*dt;
 s.roll+=(i.steer*.32*(s.v/P.maxSpeed)-s.roll)*dt*5;
 s.pitch+=(i.lean*.42-s.pitch)*dt*(ground?5:2.5);
 s.s+=s.v*dt;updateCamera(s,dt);
 if(s.contract==='slalom')for(let id=0;id<GATES.length;id++){const gate=GATES[id];if(old<gate.s&&s.s>=gate.s&&!s.gateSeen.has(id)){s.gateSeen.add(id);if(Math.abs(s.x-gate.x)<=1.8&&s.h<2.2){s.gateHits++;award(s,'gate-'+id,50);notice(s,'GATE '+s.gateHits+'/6 · nice line!')}else notice(s,'GATE MISSED · finish for practice, or R to retry')}}
 if(Math.abs(s.x)>t.width){s.x=Math.sign(s.x)*t.width;const edgeVelocity=s.vx-tangent(s.s)*s.v;s.vx=tangent(s.s)*s.v-edgeVelocity*.15;s.v=Math.max(3,s.v-5*dt);notice(s,'CURB SCRAPE · steer toward the road to keep speed')}
 if(old<900&&s.s>=900&&s.x>1.4&&(ground||s.h<=3)){s.h=Math.max(1.3,s.h);s.vy=Math.max(s.vy,Math.min(14.5,s.v*.52+.5*Math.max(s.charge,s.rampCharge)));s.rampCharge=0;s.pitch=-.10;s.flight=true;notice(s,'AIRBORNE · small steering corrections; release lean to level')}
 if(old<915&&s.s>=915&&s.x>1.4)s.gapEntry=s.h>1.3;
 if(s.s>=915&&s.s<=943&&s.x>1.4&&s.h<1.3){crash(s,'DUMPSTER HIT');return}
 if(old<943&&s.s>=943&&s.gapEntry&&s.h>=1.3&&s.x>1.4&&!s.events.has('gap')){award(s,'gap',100);s.gaps++;notice(s,'DUMPSTER GAP +100 · land level to bank it')}

 for(let id=0;id<course.hazards.length;id++){const o=course.hazards[id],end=o.s+(o.type==='barrier'?4:14),overlap=s.s>=o.s&&old<=end&&Math.abs(s.x-o.x)<o.w/2+.45;
 if(overlap&&s.h<(o.type==='barrier'?1.3:.25)&&!s.invulnerable){
 if(o.type==='barrier'){s.hazardHits.add(id);crash(s,'BARRICADE HIT');return}
 if(!s.hazardHits.has(id)){s.hazardHits.add(id);if(o.type==='boost'){s.v=Math.min(P.maxSpeed,s.v+12);notice(s,'BOOST STRIP · hold your line!');award(s,'boost-'+id,25)}else if(o.type==='oil'){s.v*=.87;s.vx+=(o.x>0?-1:1)*3;notice(s,'OIL SPILL · countersteer!')}else{s.v*=.7;notice(s,'CONE CLUSTER · speed lost')}}
 }
